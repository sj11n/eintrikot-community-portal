name: Einspielen

# Spielt Theme und Plugin auf die Entwicklungsinstallation ein.
# Von Hand unter Actions → Einspielen → Run workflow (mit Probelauf).
# Automatisch bei jedem Push auf main, der Theme oder Plugin ändert,
# sobald die Repository-Variable AUTO_DEPLOY auf true steht.

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/eintrikot-community/**'
      - 'wp-content/plugins/eintrikot-community-core/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Probelauf (zeigt Änderungen, verändert nichts)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: einspielen
  cancel-in-progress: false

jobs:
  pruefen:
    uses: ./.github/workflows/pruefen.yml

  einspielen:
    needs: pruefen
    # Push-Läufe erst, wenn die Variable AUTO_DEPLOY auf true steht (nach dem ersten erfolgreichen Lauf).
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: entwicklung
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lftp installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp

      - name: Einspielen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          WP_CONTENT_PATH: ${{ vars.WP_CONTENT_PATH }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_PROTOCOL: ${{ vars.DEPLOY_PROTOCOL || 'sftp' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          BACKUP_DIR: backup
        run: tools/deploy.sh

      # Das Repository ist öffentlich, und Artefakte öffentlicher Repositories kann jeder mit GitHub-Konto laden.
      # Die Sicherung des Servers wird deshalb nur verschlüsselt aufbewahrt (Secret BACKUP_PASSPHRASE).
      - name: Sicherung verschlüsseln
        id: sicherung
        if: always()
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [[ ! -d backup ]] || [[ -z "$(ls -A backup)" ]]; then
            echo "Keine Sicherung in diesem Lauf."
            exit 0
          fi
          if [[ -z "$BACKUP_PASSPHRASE" ]]; then
            echo "::warning::Secret BACKUP_PASSPHRASE fehlt – die Sicherung wird nicht als Artefakt abgelegt (Rücktausch während des Laufs und Git-Verlauf bleiben). Anlegen mit: gh secret set BACKUP_PASSPHRASE"
            exit 0
          fi
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase-env BACKUP_PASSPHRASE --symmetric --cipher-algo AES256 -o "sicherung-${GITHUB_RUN_NUMBER}.tar.gz.gpg"
          echo "datei=sicherung-${GITHUB_RUN_NUMBER}.tar.gz.gpg" >>"$GITHUB_OUTPUT"

      - name: Sicherung aufbewahren
        if: always() && steps.sicherung.outputs.datei != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sicherung-${{ github.run_number }}
          path: ${{ steps.sicherung.outputs.datei }}
          retention-days: 30
