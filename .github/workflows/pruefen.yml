name: Prüfen

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: PHP-Syntax (PHP 8.1, Mindestversion laut Plugin)
        run: |
          set -e
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Alle PHP-Dateien ohne Syntaxfehler."

      - name: Entwicklungswerkzeuge installieren (Composer)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Sicherheitsprüfung (PHPCS, WordPress.Security)
        run: composer phpcs

      - name: Statische Analyse (PHPStan)
        run: composer phpstan

      - name: Regeltests (lokales WordPress mit SQLite)
        run: tools/lokal-test.sh test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm

      - name: Formatierung (Prettier)
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Deploy-Skript (ShellCheck)
        run: shellcheck tools/deploy.sh tools/lokal-test.sh
