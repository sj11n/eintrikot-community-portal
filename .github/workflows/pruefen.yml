name: Prüfen

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer
          extensions: mbstring, sqlite3, pdo_sqlite

      - name: PHP-Syntax (PHP 8.1, Mindestversion laut Plugin)
        run: |
          set -e
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Alle PHP-Dateien ohne Syntaxfehler."

      - name: Entwicklungswerkzeuge installieren (Composer)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Sicherheitsprüfung (PHPCS, WordPress.Security)
        run: composer phpcs

      - name: Statische Analyse (PHPStan)
        run: composer phpstan

      - name: Regeltests (lokales WordPress mit SQLite)
        run: tools/lokal-test.sh test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Formatierung (Prettier)
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Deploy-Skript (ShellCheck)
        run: shellcheck tools/deploy.sh tools/lokal-test.sh
